[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nrdlsim"
version = "1.0.0"
description = "NR downlink link-level simulator (PDSCH chain, TR 38.901 channels, MIESM link abstraction)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# examples, notebooks and plotting scripts
examples = ["scipy>=1.10", "matplotlib>=3.6"]
# test suite: python -m pytest tests/
test = ["pytest>=7", "scipy>=1.10", "matplotlib>=3.6"]
# regenerate the notebooks: notebooks/build_*.py, notebooks/learn/build_learn.py --execute
notebooks = ["matplotlib>=3.6", "nbformat>=5.1", "nbclient>=0.7", "ipykernel>=6"]

[tool.setuptools]
packages = ["nrdlsim"]
